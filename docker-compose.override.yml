# Extra services next to the Astro containers (`astro dev start` merges this file).
# They join Astro's `airflow` network so tasks reach them by service name.
services:
  minio:
    networks: [airflow]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    networks: [airflow]
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes: [./infra/minio-init.sh:/minio-init.sh:ro]
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  warehouse-postgres:
    networks: [airflow]
    image: postgres:18
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
      POSTGRES_DB: warehouse
    ports: ["5433:5432"]
    volumes:
      - warehouse-pg:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  superset:
    networks: [airflow]
    # Built by `just up` (the Astro CLI does not build images for override services)
    image: lewagon/superset:local
    pull_policy: never
    environment:
      SUPERSET_SECRET_KEY: change-me-lewagon-demo-only
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    ports: ["8088:8088"]
    depends_on: [warehouse-postgres]
    volumes:
      - ./infra/superset/superset_config.py:/app/superset_config.py:ro
      - ./include/data:/data:ro
      - superset-home:/app/superset_home

  jupyter:
    networks: [airflow]
    # Built by `just up` (see infra/jupyter/Dockerfile)
    image: lewagon/jupyter:local
    pull_policy: never
    # Local classroom demo only: no token / password
    command: start-notebook.py --IdentityProvider.token='' --ServerApp.password=''
    environment:
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      PYICEBERG_CATALOG__LAKEHOUSE__TYPE: sql
      PYICEBERG_CATALOG__LAKEHOUSE__URI: postgresql+psycopg2://lakehouse:lakehouse@warehouse-postgres:5432/iceberg_catalog
      PYICEBERG_CATALOG__LAKEHOUSE__WAREHOUSE: s3://warehouse
      PYICEBERG_CATALOG__LAKEHOUSE__S3__ENDPOINT: http://minio:9000
      PYICEBERG_CATALOG__LAKEHOUSE__S3__ACCESS_KEY_ID: minio
      PYICEBERG_CATALOG__LAKEHOUSE__S3__SECRET_ACCESS_KEY: minio123
      PYICEBERG_CATALOG__LAKEHOUSE__S3__REGION: us-east-1
    ports: ["8888:8888"]
    depends_on: [warehouse-postgres, minio]
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./include/data:/data:ro

volumes:
  minio-data:
  warehouse-pg:
  superset-home:
