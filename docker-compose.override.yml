# Extra services next to the Astro containers (`astro dev start` merges this file).
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes: [./infra/minio-init.sh:/minio-init.sh:ro]
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  warehouse-postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lakehouse
      POSTGRES_PASSWORD: lakehouse
      POSTGRES_DB: warehouse
    ports: ["5433:5432"]
    volumes:
      - warehouse-pg:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  superset:
    build: ./infra/superset
    environment:
      SUPERSET_SECRET_KEY: change-me-lewagon-demo-only
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    ports: ["8088:8088"]
    depends_on: [warehouse-postgres]
    volumes:
      - ./infra/superset/superset_config.py:/app/superset_config.py:ro
      - ./include/data:/data:ro
      - superset-home:/app/superset_home

volumes:
  minio-data:
  warehouse-pg:
  superset-home:
